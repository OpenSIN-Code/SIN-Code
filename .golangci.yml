# .golangci.yml — SOTA lint gate for SIN-Code
# Requires golangci-lint >= 2.0
version: "2"
run:
  timeout: 5m
  tests: true
  build-tags:
    - treesitter

linters:
  default: none
  enable:
    # Correctness
    - govet
    - staticcheck
    - errcheck
    - unused
    - ineffassign
    - nilerr
    - errorlint
    - copyloopvar
    # Security
    - gosec
    # Robustness
    - bodyclose
    - rowserrcheck
    - sqlclosecheck
    - contextcheck
    - noctx
    # Style / hygiene (low-noise selection)
    - misspell
    - unconvert
    - unparam
    - prealloc
    - gocritic
  settings:
    errcheck:
      check-type-assertions: true
      check-blank: false
    gosec:
      excludes:
        - G104 # duplicate of errcheck
      config:
        G301: "0750"
        G302: "0600"
        G306: "0600"
    gocritic:
      enabled-tags:
        - diagnostic
        - performance
      disabled-checks:
        - hugeParam
    misspell:
      locale: US

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes: github.com/OpenSIN-Code/SIN-Code

issues:
  exclude-use-default: false
  max-issues-per-linter: 0
  max-same-issues: 0
  exclude-rules:
    # Tests may use weaker patterns deliberately (fixtures, temp perms)
    - path: _test\.go
      linters:
        - gosec
        - noctx
        - errcheck
    # Generated / vendored tree-sitter grammars
    - path: third.party/
      linters:
        - all
