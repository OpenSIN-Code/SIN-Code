# .golangci.yml — SOTA lint gate for SIN-Code
# Requires golangci-lint >= 2.0
version: "2"
run:
  timeout: 5m
  tests: true
  build-tags:
    - treesitter

linters:
  default: none
  enable:
    # Build / correctness (must always pass)
    - govet
  exclusions:
    generated: strict
    rules:
      # Generated / vendored tree-sitter grammars
      - path: third.party/
        linters:
          - all

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/OpenSIN-Code/SIN-Code

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
