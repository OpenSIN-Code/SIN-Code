name: Test SIN Skills

on:
  push:
    paths:
      - 'skills/**/*.md'
      - 'pkg/skills/**'
  pull_request:
    paths:
      - 'skills/**'

jobs:
  test-skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Build SIN-Code
        run: go build ./...
      - name: Run skill parser tests
        run: go test ./pkg/skills/...
      - name: Validate all SKILL.md files
        run: |
          for skill in $(find skills -name "SKILL.md"); do
            echo "Validating $skill"
            go run cmd/sin/main.go skill validate $skill || true
          done
      - name: Simulate skill run (dry-run)
        run: |
          go run cmd/sin/main.go skill list || true
