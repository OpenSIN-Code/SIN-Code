# Purpose: Run the first-party eval golden datasets via the n8n delegator.
# Docs: docs/eval.md, docs/RFC-test-automation.md, cmd/sin-code/internal/eval/eval.doc.md
# n8n-delegated per mandate M1 (see AGENTS.md §M1).
name: eval-n8n

on:
  push:
    branches: [main]
    paths:
      - 'evals/**'
      - 'cmd/sin-code/internal/eval/**'
      - 'cmd/sin-code/internal/evalharness/**'
      - 'cmd/sin-code/internal/dataset/**'
      - 'cmd/sin-code/eval_cmd.go'
      - '.github/workflows/eval-n8n.yml'
  pull_request:
    paths:
      - 'evals/**'
      - 'cmd/sin-code/internal/eval/**'
      - 'cmd/sin-code/internal/evalharness/**'
      - 'cmd/sin-code/internal/dataset/**'
      - 'cmd/sin-code/eval_cmd.go'
  workflow_dispatch:
    inputs:
      datasets:
        description: 'Comma-separated dataset paths (default: all golden datasets)'
        required: false
        default: 'evals/critical.json,evals/test-generation.json,evals/mutation.json,evals/fuzzing.json,evals/property.json,evals/quality-gate.json,evals/three-arm-example.json,evals/skill-code.json,evals/skill-debug.json,evals/skill-github.json,evals/skill-browser.json,evals/skill-design.json,evals/skill-ecosystem.json,evals/skill-infrastructure.json,evals/skill-memory.json,evals/skill-planning.json,evals/skill-process.json,evals/skill-shop.json'
      min_pass_rate:
        description: 'Minimum pass rate (0.0..1.0)'
        required: false
        default: '0.8'

jobs:
  delegate:
    name: Delegate eval runs to n8n
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
      - name: Trigger n8n webhook
        env:
          N8N_CI_WEBHOOK_URL: ${{ secrets.N8N_CI_WEBHOOK_URL }}
        run: |
          if [[ -z "$N8N_CI_WEBHOOK_URL" ]]; then
            echo "::error::N8N_CI_WEBHOOK_URL secret is not configured"
            exit 1
          fi
          DATASETS="${{ inputs.datasets || 'evals/critical.json,evals/test-generation.json,evals/mutation.json,evals/fuzzing.json,evals/property.json,evals/quality-gate.json,evals/three-arm-example.json,evals/skill-code.json,evals/skill-debug.json,evals/skill-github.json' }}"
          curl -fsS -X POST \
            -H "Content-Type: application/json" \
            -d "{\"workflow\":\"eval-n8n\",\"ref\":\"${{ github.ref }}\",\"sha\":\"${{ github.sha }}\",\"repo\":\"${{ github.repository }}\",\"actor\":\"${{ github.actor }}\",\"datasets\":\"$DATASETS\",\"min_pass_rate\":\"${{ inputs.min_pass_rate || '0.8' }}\"}" \
            "$N8N_CI_WEBHOOK_URL"
      - name: Echo local pre-checks
        run: |
          go version
          go vet ./cmd/sin-code/internal/eval/...
          go vet ./cmd/sin-code/internal/evalharness/...
          go vet ./cmd/sin-code/internal/dataset/...
          echo "Heavy eval work delegated to n8n."
